<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>docgraph</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --fg: #1d1d1f; --muted: #6b6b73; --card: #ffffff; --line: #dcdce1;
    --accent: #2f5fd0; --accent-fg: #ffffff; --warn: #9a5b00; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --fg: #e8e8ea; --muted: #9a9aa3; --card: #1e1e21; --line: #34343a;
            --accent: #7aa2ff; --accent-fg: #101012; --warn: #e0a84a; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.25rem; margin: 0 0 16px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: .9rem; margin-left: 8px; }
  form { display: grid; gap: 8px; }
  textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; font: inherit;
             color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .row label { font-size: .9rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  select, input[type=number] { font: inherit; background: var(--card); color: inherit;
         border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  input[type=number] { width: 4.5em; }
  button { font: inherit; cursor: pointer; }
  #go { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 7px 18px; margin-left: auto; }
  #go:disabled { opacity: .55; cursor: progress; }
  #status { margin: 14px 0 4px; min-height: 1.4em; font-size: .85rem; color: var(--muted); }
  #status .warn { color: var(--warn); }
  #status .err { color: var(--err); }
  #answer { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line);
            border-radius: 8px; padding: 14px 16px; min-height: 3.2em; }
  #answer:empty { display: none; }
  .cite { font: inherit; font-size: .8em; padding: 0 5px; margin: 0 1px; border-radius: 4px; cursor: pointer;
          background: transparent; color: var(--accent); border: 1px solid var(--accent); vertical-align: baseline; }
  .cite.bad { color: var(--muted); border-color: var(--line); cursor: default; }
  h2 { font-size: .95rem; margin: 22px 0 8px; color: var(--muted); font-weight: 600; }
  #citations { display: grid; gap: 8px; }
  .card { text-align: left; width: 100%; background: var(--card); color: inherit; border: 1px solid var(--line);
          border-radius: 8px; padding: 10px 12px; }
  .card:hover, .card.open { border-color: var(--accent); }
  .card .n { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .card .meta { font-size: .85rem; color: var(--muted); }
  .card .snip { margin-top: 4px; font-size: .9rem; overflow: hidden; display: -webkit-box;
                -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #viewer { display: none; margin-top: 12px; background: var(--card); border: 1px solid var(--accent);
            border-radius: 8px; padding: 14px 16px; }
  #viewer.show { display: block; }
  #viewer header { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .88rem; color: var(--muted); margin-bottom: 8px; }
  #viewer header b { color: var(--fg); }
  #viewer pre { white-space: pre-wrap; margin: 0; font: inherit; }
  #viewer .nav { display: flex; gap: 8px; margin-top: 10px; }
  #viewer .nav button, #viewer .close { background: transparent; color: var(--accent); border: 1px solid var(--line);
         border-radius: 6px; padding: 2px 10px; }
  #viewer .nav button:disabled { opacity: .4; cursor: default; }
  #viewer .close { margin-left: auto; }
  details { margin-top: 18px; font-size: .85rem; color: var(--muted); }
  details li { margin: 2px 0; }
</style>
</head>
<body>
<main>
  <h1>docgraph<span>answers from your documents, with sources</span></h1>

  <form id="form">
    <textarea id="q" placeholder="Ask a question about the indexed documents" required maxlength="4000"></textarea>
    <div class="row">
      <label>Mode
        <select id="mode"><option value="">default</option><option>pipeline</option><option>agent</option></select>
      </label>
      <label>Passages <input id="topk" type="number" min="1" max="20" placeholder="5"></label>
      <label><input id="graph" type="checkbox"> graph</label>
      <label><input id="rerank" type="checkbox"> rerank</label>
      <button id="go" type="submit">Ask</button>
    </div>
  </form>

  <div id="status" role="status"></div>
  <div id="answer" aria-live="polite"></div>

  <h2 id="cit-title" hidden>Sources</h2>
  <div id="citations"></div>
  <div id="viewer" aria-live="polite"></div>
  <details id="others" hidden><summary>Other passages the model was shown</summary><ul id="others-list"></ul></details>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let answerText = "";
let citeByN = new Map();
let busy = false;

function setStatus(msg, cls) {
  const el = $("status");
  el.textContent = "";
  if (!msg) return;
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = msg;
  el.appendChild(span);
}

function resetOutput() {
  answerText = "";
  citeByN = new Map();
  $("answer").textContent = "";
  $("citations").textContent = "";
  $("cit-title").hidden = true;
  $("others").hidden = true;
  $("others-list").textContent = "";
  $("viewer").className = "";
  $("viewer").textContent = "";
}

function where(c) {
  const bits = [c.file || c.document];
  if (c.page != null) bits.push(c.page_end && c.page_end !== c.page ? `pp. ${c.page}-${c.page_end}` : `p. ${c.page}`);
  if (c.heading) bits.push(c.heading);
  return bits.join(" · ");
}

// Render the finished answer with [n] markers as buttons that open the passage.
function renderAnswer() {
  const root = $("answer");
  root.textContent = "";
  const re = /\[(\d+(?:\s*[,;]\s*\d+)*)\]/g;
  let last = 0, m;
  while ((m = re.exec(answerText)) !== null) {
    if (m.index > last) root.appendChild(document.createTextNode(answerText.slice(last, m.index)));
    for (const part of m[1].split(/\s*[,;]\s*/)) {
      const n = Number(part);
      const b = document.createElement("button");
      b.type = "button";
      b.className = "cite" + (citeByN.has(n) ? "" : " bad");
      b.textContent = String(n);
      b.title = citeByN.has(n) ? where(citeByN.get(n)) : "not a source of this answer";
      if (citeByN.has(n)) b.addEventListener("click", () => openPassage(citeByN.get(n).id, n));
      root.appendChild(b);
    }
    last = m.index + m[0].length;
  }
  if (last < answerText.length) root.appendChild(document.createTextNode(answerText.slice(last)));
}

function renderCitations(ev) {
  citeByN = new Map(ev.citations.map((c) => [c.n, c]));
  const box = $("citations");
  box.textContent = "";
  $("cit-title").hidden = ev.citations.length === 0;
  for (const c of ev.citations) {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.n = String(c.n);
    const head = document.createElement("div");
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = `[${c.n}]`;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `${c.document} — ${where(c)}`;
    head.append(n, meta);
    const snip = document.createElement("div");
    snip.className = "snip";
    snip.textContent = c.text;
    card.append(head, snip);
    card.addEventListener("click", () => openPassage(c.id, c.n));
    box.appendChild(card);
  }
  const cited = new Set(ev.citations.map((c) => c.n));
  const others = ev.passages.filter((p) => !cited.has(p.n));
  $("others").hidden = others.length === 0;
  const ul = $("others-list");
  ul.textContent = "";
  for (const p of others) {
    const li = document.createElement("li");
    const a = document.createElement("button");
    a.type = "button";
    a.className = "cite";
    a.textContent = String(p.n);
    a.addEventListener("click", () => openPassage(p.id, p.n));
    li.append(a, document.createTextNode(` ${p.document} — ${where(p)}`));
    ul.appendChild(li);
  }
  if (ev.flagged.length) {
    setStatus(`Removed citation(s) to passages the model was not given: ${ev.flagged.map((n) => "[" + n + "]").join(" ")}`, "warn");
  }
}

async function openPassage(id, n) {
  const v = $("viewer");
  v.className = "show";
  v.textContent = "Loading…";
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("open", c.dataset.n === String(n)));
  try {
    const r = await fetch(`/passages/${id}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const p = await r.json();
    v.textContent = "";
    const head = document.createElement("header");
    const add = (label, value) => {
      if (value === null || value === undefined || value === "") return;
      const s = document.createElement("span");
      const b = document.createElement("b");
      b.textContent = value;
      s.append(label + " ", b);
      head.appendChild(s);
    };
    add("Document", p.document);
    add("File", p.file);
    add("Page", p.location ? p.location.replace(/^pp?\. /, "") : "");
    add("Section", p.heading);
    const close = document.createElement("button");
    close.type = "button"; close.className = "close"; close.textContent = "Close";
    close.addEventListener("click", () => { v.className = ""; });
    head.appendChild(close);
    const pre = document.createElement("pre");
    pre.textContent = p.text;
    const nav = document.createElement("div");
    nav.className = "nav";
    for (const [label, target] of [["← Previous passage", p.prev_id], ["Next passage →", p.next_id]]) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.disabled = target == null;
      if (target != null) b.addEventListener("click", () => openPassage(target, null));
      nav.appendChild(b);
    }
    v.append(head, pre, nav);
  } catch (e) {
    v.textContent = `Could not load the passage: ${e.message}`;
  }
}

function handle(name, ev) {
  switch (name) {
    case "token": answerText += ev.text; $("answer").textContent = answerText; break;
    case "retract": answerText = ""; $("answer").textContent = ""; break;
    case "retrieval": setStatus(ev.relevant ? `Retrieved ${ev.count} passages…` : "Nothing relevant found."); break;
    case "tool": setStatus(`${ev.name}(${Object.values(ev.arguments).join(", ")}): ${ev.summary}`); break;
    case "notice": setStatus(ev.message, "warn"); break;
    case "citations": renderCitations(ev); break;
    case "done": {
      renderAnswer();
      const bits = [];
      if (ev.mode) bits.push(ev.mode + " mode");
      if (ev.fallback) bits.push("fell back from agent");
      if (ev.endpoint) bits.push(ev.endpoint + (ev.model ? " / " + ev.model : ""));
      if (ev.uncited && !ev.no_answer) bits.push("the answer cites no passage");
      if (!$("status").textContent.startsWith("Removed")) setStatus(bits.join(" · "));
      break;
    }
    case "error": setStatus(ev.message, "err"); break;
  }
}

async function ask(body) {
  const resp = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!resp.ok) {
    let detail = `HTTP ${resp.status}`;
    try { detail = JSON.stringify((await resp.json()).detail); } catch (_) { /* keep the status */ }
    throw new Error(detail);
  }
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true }).replace(/\r\n/g, "\n");
    let i;
    while ((i = buf.indexOf("\n\n")) !== -1) {
      const raw = buf.slice(0, i);
      buf = buf.slice(i + 2);
      let name = "message", data = "";
      for (const line of raw.split("\n")) {
        if (line.startsWith("event:")) name = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) handle(name, JSON.parse(data));
    }
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) return;
  const q = $("q").value.trim();
  if (!q) return;
  busy = true;
  $("go").disabled = true;
  resetOutput();
  setStatus("Searching…");
  const body = { question: q };
  if ($("mode").value) body.mode = $("mode").value;
  if ($("topk").value) body.top_k = Number($("topk").value);
  if ($("graph").checked) body.graph = true;
  if ($("rerank").checked) body.rerank = true;
  try {
    await ask(body);
  } catch (err) {
    setStatus(`Request failed: ${err.message}`, "err");
  } finally {
    busy = false;
    $("go").disabled = false;
  }
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit();
});
</script>
</body>
</html>

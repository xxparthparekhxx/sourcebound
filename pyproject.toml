[project]
name = "sourcebound"
version = "0.1.0"
description = "Answer questions over local documents with cited sources: hybrid retrieval, an optional knowledge graph, Ollama or any OpenAI-compatible endpoint."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Parth Parekh" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "chromadb>=1.0",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# openjev-flash reranker / faithfulness scorer (CPU torch is enough)
rerank = ["torch>=2.4", "transformers>=4.56", "huggingface-hub>=0.24"]
# dataset loading for the Qasper eval
eval = ["pyarrow>=15", "huggingface-hub>=0.24"]

[project.scripts]
sourcebound = "sourcebound.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

# Linux: take torch from the CPU index (the default wheels pull several GB of CUDA libraries).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
